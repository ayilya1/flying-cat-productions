    <script>

            let articles = [];

            /* =====================================================
   SEO
   ===================================================== */

const SITE_URL =
    "https://www.flyingcatproductions.com";


function setMetaTag(
    selector,
    attributeName,
    attributeValue,
    content
) {

    let tag =
        document.head.querySelector(
            selector
        );

    if (!tag) {

        tag =
            document.createElement(
                "meta"
            );

        tag.setAttribute(
            attributeName,
            attributeValue
        );

        document.head.appendChild(
            tag
        );

    }

    tag.setAttribute(
        "content",
        content || ""
    );

}


function setCanonical(
    url
) {

    let canonical =
        document.head.querySelector(
            'link[rel="canonical"]'
        );

    if (!canonical) {

        canonical =
            document.createElement(
                "link"
            );

        canonical.rel =
            "canonical";

        document.head.appendChild(
            canonical
        );

    }

    canonical.href =
        url;

}


function setStructuredData(
    data
) {

    let script =
        document.getElementById(
            "pageStructuredData"
        );

    if (!script) {

        script =
            document.createElement(
                "script"
            );

        script.type =
            "application/ld+json";

        script.id =
            "pageStructuredData";

        document.head.appendChild(
            script
        );

    }

    script.textContent =
        JSON.stringify(data);

}


function applyNewsIndexSeo() {

    const url =
        `${SITE_URL}/news.html`;

    applyNewsIndexSeo();


    setMetaTag(
        'meta[name="description"]',
        "name",
        "description",
        "Latest news from Flying Cat Productions, including film premieres, festival selections, screenings, production updates and independent filmmaking in Vancouver."
    );


    setMetaTag(
        'meta[property="og:type"]',
        "property",
        "og:type",
        "website"
    );


    setMetaTag(
        'meta[property="og:title"]',
        "property",
        "og:title",
        "News — Flying Cat Productions"
    );


    setMetaTag(
        'meta[property="og:description"]',
        "property",
        "og:description",
        "Film premieres, festival selections, screenings and production updates from Flying Cat Productions."
    );


    setMetaTag(
        'meta[property="og:url"]',
        "property",
        "og:url",
        url
    );


    setCanonical(
        url
    );


    setStructuredData({
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "News — Flying Cat Productions",
        "url": url,
        "description":
            "Film premieres, festival selections, screenings and production updates from Flying Cat Productions.",
        "publisher": {
            "@type": "Organization",
            "name": "Flying Cat Productions",
            "url": `${SITE_URL}/`
        }
    });

}


            /* =====================================================
               HTML ESCAPE
               ===================================================== */

            function escapeHtml(
                value
            ) {

                return String(
                    value ?? ""
                )

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

            }



            /* =====================================================
               STRAPI DATA NORMALISATION
               ===================================================== */

            function normaliseEntry(
                entry
            ) {

                if (
                    !entry
                ) {

                    return null;

                }


                if (
                    entry.attributes
                ) {

                    return {

                        ...entry.attributes,

                        id:
                            entry.id,

                        documentId:
                            entry.documentId

                    };

                }


                return entry;

            }



            /* =====================================================
               MEDIA HELPERS
               ===================================================== */

            function getMedia(
                media
            ) {

                if (
                    !media
                ) {

                    return null;

                }


                if (
                    media.data
                ) {

                    return normaliseEntry(
                        media.data
                    );

                }


                return normaliseEntry(
                    media
                );

            }



            function getMediaUrl(
                media,
                preferredFormat = ""
            ) {

                const actual =
                    getMedia(
                        media
                    );


                if (
                    !actual
                ) {

                    return "";

                }


                let url = "";


                if (
                    preferredFormat
                    &&
                    actual.formats
                    &&
                    actual.formats[
                        preferredFormat
                    ]
                    &&
                    actual.formats[
                        preferredFormat
                    ].url
                ) {

                    url =
                        actual.formats[
                            preferredFormat
                        ].url;

                }

                else {

                    url =
                        actual.url
                        ||
                        "";

                }


                if (
                    !url
                ) {

                    return "";

                }


                if (
                    /^https?:\/\//i.test(
                        url
                    )
                ) {

                    return url;

                }


                return (
                    `${STRAPI_URL}${url}`
                );

            }



            /* =====================================================
               DATE HELPERS
               ===================================================== */

            function parseDate(
                date
            ) {

                if (
                    !date
                ) {

                    return null;

                }


                const parsed =
                    new Date(
                        `${date}T12:00:00`
                    );


                if (
                    Number.isNaN(
                        parsed.getTime()
                    )
                ) {

                    return null;

                }


                return parsed;

            }



            function formatDate(
                date
            ) {

                const parsed =
                    parseDate(
                        date
                    );


                if (
                    !parsed
                ) {

                    return (
                        date
                        ||
                        ""
                    );

                }


                return new Intl.DateTimeFormat(
                    "en-CA",
                    {

                        month:
                            "long",

                        day:
                            "numeric",

                        year:
                            "numeric"

                    }
                )
                .format(
                    parsed
                );

            }



            function formatMonthYear(
                date
            ) {

                const parsed =
                    parseDate(
                        date
                    );


                if (
                    !parsed
                ) {

                    return "Undated";

                }


                return new Intl.DateTimeFormat(
                    "en-CA",
                    {

                        month:
                            "long",

                        year:
                            "numeric"

                    }
                )
                .format(
                    parsed
                );

            }



            function monthKey(
                date
            ) {

                if (
                    !date
                ) {

                    return "undated";

                }


                return date.slice(
                    0,
                    7
                );

            }



            /* =====================================================
               ARTICLE URL
               ===================================================== */

}



            /* =====================================================
               STRAPI QUERY
               ===================================================== */

            function buildArticleQuery() {

                const query =
                    new URLSearchParams();


                query.set(
                    "pagination[pageSize]",
                    "100"
                );


                query.set(
                    "sort[0]",
                    "publicationDate:desc"
                );


                query.set(
                    "sort[1]",
                    "order:asc"
                );


                query.set(
                    "populate[thumbnail]",
                    "true"
                );


                query.set(
                    "populate[heroImage]",
                    "true"
                );


                query.set(
                    "populate[content][on][article.para][populate]",
                    "*"
                );


                query.set(
                    "populate[content][on][article.heading][populate]",
                    "*"
                );


                query.set(
                    "populate[content][on][article.image][populate][image]",
                    "true"
                );


                query.set(
                    "populate[content][on][article.quote][populate]",
                    "*"
                );


                query.set(
                    "populate[content][on][article.video][populate]",
                    "*"
                );


                query.set(
                    "populate[content][on][article.audio][populate][audio]",
                    "true"
                );


                query.set(
                    "populate[content][on][article.divider][populate]",
                    "*"
                );


                query.set(
                    "populate[content][on][article.contributor][populate]",
                    "*"
                );


                return query.toString();

            }



            /* =====================================================
               RICH TEXT
               ===================================================== */

            function renderTextNode(
                node
            ) {

                if (
                    !node
                ) {

                    return "";

                }


                if (
                    node.type
                    ===
                    "link"
                ) {

                    const href =
                        node.url
                        ||
                        "#";


                    const children =
                        (
                            node.children
                            ||
                            []
                        )

                        .map(
                            renderTextNode
                        )

                        .join(
                            ""
                        );


                    return `
                        <a
                            href="${escapeHtml(href)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            ${children}
                        </a>
                    `;

                }


                let value =
                    escapeHtml(
                        node.text
                        ||
                        ""
                    );


                if (
                    node.bold
                ) {

                    value =
                        `<strong>${value}</strong>`;

                }


                if (
                    node.italic
                ) {

                    value =
                        `<em>${value}</em>`;

                }


                if (
                    node.underline
                ) {

                    value =
                        `<u>${value}</u>`;

                }


                if (
                    node.strikethrough
                ) {

                    value =
                        `<s>${value}</s>`;

                }


                if (
                    node.code
                ) {

                    value =
                        `<code>${value}</code>`;

                }


                return value;

            }



            function renderRichTextBlocks(
                blocks
            ) {

                if (
                    !Array.isArray(
                        blocks
                    )
                ) {

                    return "";

                }


                return blocks

                    .map(
                        block => {


                            if (
                                !block
                            ) {

                                return "";

                            }



                            /* -------------------------------
                               Heading
                               ------------------------------- */

                            if (
                                block.type
                                ===
                                "heading"
                            ) {

                                const children =
                                    (
                                        block.children
                                        ||
                                        []
                                    )

                                    .map(
                                        renderTextNode
                                    )

                                    .join(
                                        ""
                                    );


                                return `
                                    <h2 class="article-heading">
                                        ${children}
                                    </h2>
                                `;

                            }



                            /* -------------------------------
                               List
                               ------------------------------- */

                            if (
                                block.type
                                ===
                                "list"
                            ) {

                                const tag =
                                    block.format
                                    ===
                                    "ordered"

                                    ?

                                    "ol"

                                    :

                                    "ul";


                                const items =
                                    (
                                        block.children
                                        ||
                                        []
                                    )

                                    .map(
                                        item => {


                                            const text =
                                                (
                                                    item.children
                                                    ||
                                                    []
                                                )

                                                .map(
                                                    renderTextNode
                                                )

                                                .join(
                                                    ""
                                                );


                                            return (
                                                `<li>${text}</li>`
                                            );

                                        }
                                    )

                                    .join(
                                        ""
                                    );


                                return (
                                    `<${tag}>${items}</${tag}>`
                                );

                            }



                            /* -------------------------------
                               Quote
                               ------------------------------- */

                            if (
                                block.type
                                ===
                                "quote"
                            ) {

                                const children =
                                    (
                                        block.children
                                        ||
                                        []
                                    )

                                    .map(
                                        renderTextNode
                                    )

                                    .join(
                                        ""
                                    );


                                return `
                                    <blockquote class="article-quote">
                                        ${children}
                                    </blockquote>
                                `;

                            }



                            /* -------------------------------
                               Paragraph
                               ------------------------------- */

                            const children =
                                (
                                    block.children
                                    ||
                                    []
                                )

                                .map(
                                    renderTextNode
                                )

                                .join(
                                    ""
                                );


                            return (
                                `<p>${children}</p>`
                            );

                        }
                    )

                    .join(
                        ""
                    );

            }



            /* =====================================================
               VIDEO
               ===================================================== */

            function getVideoEmbedUrl(
                value
            ) {

                if (
                    !value
                ) {

                    return "";

                }


                try {


                    const url =
                        new URL(
                            value
                        );


                    /* YouTube */

                    if (
                        url.hostname.includes(
                            "youtube.com"
                        )
                    ) {

                        const id =
                            url.searchParams.get(
                                "v"
                            );


                        if (
                            id
                        ) {

                            return (
                                `https://www.youtube.com/embed/${id}`
                            );

                        }

                    }


                    /* YouTube short URL */

                    if (
                        url.hostname
                        ===
                        "youtu.be"
                    ) {

                        const id =
                            url.pathname
                            .replace(
                                "/",
                                ""
                            );


                        if (
                            id
                        ) {

                            return (
                                `https://www.youtube.com/embed/${id}`
                            );

                        }

                    }


                    /* Vimeo */

                    if (
                        url.hostname.includes(
                            "vimeo.com"
                        )
                    ) {

                        const id =
                            url.pathname

                            .split(
                                "/"
                            )

                            .filter(
                                Boolean
                            )

                            .pop();


                        if (
                            id
                        ) {

                            return (
                                `https://player.vimeo.com/video/${id}`
                            );

                        }

                    }


                    return value;


                }

                catch(
                    error
                ) {

                    return "";

                }

            }



            /* =====================================================
               DYNAMIC ZONE CONTENT
               ===================================================== */

            function renderContentBlock(
                block
            ) {

                if (
                    !block
                ) {

                    return "";

                }


                const component =
                    block.__component
                    ||
                    block.type
                    ||
                    "";



                /* =================================================
                   PARAGRAPH
                   ================================================= */

                if (
                    component
                    ===
                    "article.para"

                    ||

                    component
                    ===
                    "paragraph"
                ) {

                    return renderRichTextBlocks(
                        block.text
                        ||
                        []
                    );

                }



                /* =================================================
                   HEADING
                   ================================================= */

                if (
                    component
                    ===
                    "article.heading"

                    ||

                    component
                    ===
                    "heading"
                ) {

                    return `
                        <h2 class="article-heading">
                            ${escapeHtml(
                                block.text
                                ||
                                ""
                            )}
                        </h2>
                    `;

                }



                /* =================================================
                   IMAGE
                   ================================================= */

                if (
                    component
                    ===
                    "article.image"

                    ||

                    component
                    ===
                    "image"
                ) {

                    const imageUrl =
                        getMediaUrl(
                            block.image
                            ||
                            block.src
                        );


                    if (
                        !imageUrl
                    ) {

                        return "";

                    }


                    const imageAlt =
                        escapeHtml(
                            block.alt
                            ||
                            ""
                        );


                    const caption =
                        block.caption

                        ?

                        `
                            <figcaption class="article-caption">
                                ${escapeHtml(
                                    block.caption
                                )}
                            </figcaption>
                        `

                        :

                        "";


                    return `
                        <figure class="article-image-block">

                            <img
                                src="${escapeHtml(imageUrl)}"
                                alt="${imageAlt}"
                                loading="lazy"

                                onload="
                                    if (
                                        this.naturalHeight
                                        >
                                        this.naturalWidth
                                    ) {
                                        this
                                        .closest(
                                            '.article-image-block'
                                        )
                                        .classList
                                        .add(
                                            'portrait'
                                        );
                                    }
                                "
                            >

                            ${caption}

                        </figure>
                    `;

                }



                /* =================================================
                   QUOTE
                   ================================================= */

                if (
                    component
                    ===
                    "article.quote"

                    ||

                    component
                    ===
                    "quote"
                ) {

                    const attribution =
                        block.attribution

                        ?

                        `
                            <span class="article-quote-attribution">
                                ${escapeHtml(
                                    block.attribution
                                )}
                            </span>
                        `

                        :

                        "";


                    return `
                        <blockquote class="article-quote">

                            ${escapeHtml(
                                block.text
                                ||
                                ""
                            )}

                            ${attribution}

                        </blockquote>
                    `;

                }



                /* =================================================
                   VIDEO
                   ================================================= */

                if (
                    component
                    ===
                    "article.video"

                    ||

                    component
                    ===
                    "video"
                ) {

                    const embedUrl =
                        getVideoEmbedUrl(

                            block.url

                            ||

                            block.embed

                            ||

                            block.embedUrl

                        );


                    if (
                        !embedUrl
                    ) {

                        return "";

                    }


                    const caption =
                        block.caption

                        ?

                        `
                            <figcaption class="article-caption">
                                ${escapeHtml(
                                    block.caption
                                )}
                            </figcaption>
                        `

                        :

                        "";


                    return `
                        <figure class="article-media-block">

                            <div class="article-video">

                                <iframe
                                    src="${escapeHtml(embedUrl)}"
                                    title="Embedded video"
                                    loading="lazy"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                    allowfullscreen
                                ></iframe>

                            </div>

                            ${caption}

                        </figure>
                    `;

                }



                /* =================================================
                   AUDIO
                   ================================================= */

                if (
                    component
                    ===
                    "article.audio"

                    ||

                    component
                    ===
                    "audio"
                ) {

                    const audioUrl =
                        getMediaUrl(
                            block.audio
                        );


                    if (
                        !audioUrl
                    ) {

                        return "";

                    }


                    return `
                        <figure
                            class="
                                article-media-block
                                article-audio
                            "
                        >

                            <audio
                                controls
                                preload="metadata"
                                src="${escapeHtml(audioUrl)}"
                            ></audio>

                            ${
                                block.caption

                                ?

                                `
                                    <figcaption class="article-caption">
                                        ${escapeHtml(
                                            block.caption
                                        )}
                                    </figcaption>
                                `

                                :

                                ""
                            }

                        </figure>
                    `;

                }



                /* =================================================
                   DIVIDER
                   ================================================= */

                if (
                    component
                    ===
                    "article.divider"

                    ||

                    component
                    ===
                    "divider"
                ) {

                    return `
                        <div class="article-divider"></div>

                        ${
                            block.label

                            ?

                            `
                                <div class="article-divider-label">
                                    ${escapeHtml(
                                        block.label
                                    )}
                                </div>
                            `

                            :

                            ""
                        }
                    `;

                }



                /* =================================================
                   CONTRIBUTOR
                   ================================================= */

                if (
                    component
                    ===
                    "article.contributor"

                    ||

                    component
                    ===
                    "contributor"
                ) {

                    return `
                        <section class="article-contributor">


                            ${
                                block.sectionTitle

                                ?

                                `
                                    <div class="story-meta">
                                        ${escapeHtml(
                                            block.sectionTitle
                                        )}
                                    </div>
                                `

                                :

                                ""
                            }


                            <h3>
                                ${escapeHtml(
                                    block.author
                                    ||
                                    ""
                                )}
                            </h3>


                            ${
                                block.role

                                ?

                                `
                                    <div class="article-contributor-role">
                                        ${escapeHtml(
                                            block.role
                                        )}
                                    </div>
                                `

                                :

                                ""
                            }


                            ${
                                renderRichTextBlocks(
                                    block.text
                                    ||
                                    []
                                )
                            }


                        </section>
                    `;

                }


                return "";

            }



            /* =====================================================
               FEATURED NEWS STORY
               ===================================================== */

            function renderFeatured(
                article
            ) {

                const media =
                    getMedia(
                        article.heroImage
                        ||
                        article.thumbnail
                    );


                const imageUrl =
                    getMediaUrl(

                        article.heroImage
                        ||
                        article.thumbnail,

                        "large"

                    );


                const alt =
                    media
                    ?.alternativeText

                    ||

                    article.title

                    ||

                    "";


                return `
                    <section class="featured-story">


                        <a
                            href="${escapeHtml(
                                articleUrl(
                                    article
                                )
                            )}"
                            class="featured-image"
                        >


                            ${
                                imageUrl

                                ?

                                `
                                    <img
                                        src="${escapeHtml(imageUrl)}"
                                        alt="${escapeHtml(alt)}"
                                    >
                                `

                                :

                                ""
                            }


                        </a>



                        <div class="featured-panel">


                            <div>


                                <div class="featured-kicker">

                                    ${
                                        escapeHtml(
                                            formatMonthYear(
                                                article.publicationDate
                                            )
                                        )
                                    }

                                    / Featured

                                </div>


                                <h2>

                                    ${
                                        escapeHtml(
                                            article.title
                                            ||
                                            "Untitled"
                                        )
                                    }

                                </h2>


                                <p>

                                    ${
                                        escapeHtml(
                                            article.excerpt
                                            ||
                                            article.subtitle
                                            ||
                                            ""
                                        )
                                    }

                                </p>


                            </div>



                            <a
                                href="${escapeHtml(
                                    articleUrl(
                                        article
                                    )
                                )}"
                                class="story-link"
                            >

                                Read Story

                                <span>
                                    →
                                </span>

                            </a>


                        </div>


                    </section>
                `;

            }



            /* =====================================================
               STORY CARD
               ===================================================== */

            function renderStoryCard(
                article
            ) {

                const media =
                    getMedia(
                        article.thumbnail
                        ||
                        article.heroImage
                    );


                const imageUrl =
                    getMediaUrl(

                        article.thumbnail
                        ||
                        article.heroImage,

                        "medium"

                    );


                const alt =
                    media
                    ?.alternativeText

                    ||

                    article.title

                    ||

                    "";


                return `
                    <a
                        href="${escapeHtml(
                            articleUrl(
                                article
                            )
                        )}"
                        class="story-card"
                    >


                        <div class="story-image">


                            ${
                                imageUrl

                                ?

                                `
                                    <img
                                        src="${escapeHtml(imageUrl)}"
                                        alt="${escapeHtml(alt)}"
                                        loading="lazy"
                                    >
                                `

                                :

                                ""
                            }


                        </div>



                        <div class="story-meta">

                            ${
                                escapeHtml(
                                    article.category
                                    ||
                                    "News"
                                )
                            }

                            /

                            ${
                                escapeHtml(
                                    formatDate(
                                        article.publicationDate
                                    )
                                )
                            }

                        </div>



                        <h3>

                            ${
                                escapeHtml(
                                    article.title
                                    ||
                                    "Untitled"
                                )
                            }

                        </h3>



                        <span class="story-arrow">
                            →
                        </span>


                    </a>
                `;

            }



            /* =====================================================
               MONTH SECTION
               ===================================================== */

            function renderMonthSection(
                monthArticles
            ) {

                if (
                    !monthArticles.length
                ) {

                    return "";

                }


                const month =
                    formatMonthYear(
                        monthArticles[
                            0
                        ].publicationDate
                    );


                const count =
                    monthArticles.length;


                return `
                    <section>


                        <div class="date-strip">


                            <div class="date-strip-label">
                                ${escapeHtml(month)}
                            </div>


                            <div class="date-strip-count">

                                ${
                                    count
                                    ===
                                    1

                                    ?

                                    "1 Dispatch"

                                    :

                                    `${count} Dispatches`
                                }

                            </div>


                        </div>



                        <div
                            class="
                                august-grid
                                news-month-grid
                            "
                        >

                            ${
                                monthArticles

                                .map(
                                    renderStoryCard
                                )

                                .join(
                                    ""
                                )
                            }

                        </div>


                    </section>
                `;

            }



            /* =====================================================
               RENDER MAIN NEWS PAGE
               ===================================================== */

            function renderIndex() {

                document.title =
                    "News — Flying Cat Productions";


                newsIntro.hidden =
                    false;


                newsIndex.hidden =
                    false;


                articleView.hidden =
                    true;



                if (
                    !articles.length
                ) {

                    cmsStatus.hidden =
                        true;


                    newsFeed.innerHTML =
                        `
                            <div class="news-empty">
                                No published news yet.
                            </div>
                        `;


                    return;

                }



                const featured =
                    articles.find(
                        article =>
                            article.featured
                    )

                    ||

                    articles[
                        0
                    ];



                const remaining =
                    articles.filter(
                        article =>
                            article
                            !==
                            featured
                    );



                const groups =
                    new Map();



                remaining.forEach(
                    article => {


                        const key =
                            monthKey(
                                article.publicationDate
                            );


                        if (
                            !groups.has(
                                key
                            )
                        ) {

                            groups.set(
                                key,
                                []
                            );

                        }


                        groups
                        .get(
                            key
                        )
                        .push(
                            article
                        );


                    }
                );



                newsFeed.innerHTML =

                    renderFeatured(
                        featured
                    )

                    +

                    Array.from(
                        groups.values()
                    )

                    .map(
                        renderMonthSection
                    )

                    .join(
                        ""
                    );


                cmsStatus.hidden =
                    true;

            }



            /* =====================================================
               RENDER ARTICLE
               ===================================================== */

            function renderArticle(
                article
            ) {

               const articleCanonical =
    `${SITE_URL}/news/${encodeURIComponent(
        article.slug
    )}`;


const articleDescription =
    article.excerpt
    ||
    article.subtitle
    ||
    `Read the latest from Flying Cat Productions: ${article.title}.`;


const articleHero =
    getMediaUrl(
        article.heroImage
        ||
        article.thumbnail,
        "large"
    );


document.title =
    `${article.title || "News"} — Flying Cat Productions`;


setMetaTag(
    'meta[name="description"]',
    "name",
    "description",
    articleDescription
);


setMetaTag(
    'meta[property="og:type"]',
    "property",
    "og:type",
    "article"
);


setMetaTag(
    'meta[property="og:title"]',
    "property",
    "og:title",
    article.title || "Flying Cat Productions"
);


setMetaTag(
    'meta[property="og:description"]',
    "property",
    "og:description",
    articleDescription
);


setMetaTag(
    'meta[property="og:url"]',
    "property",
    "og:url",
    articleCanonical
);


if (articleHero) {

    setMetaTag(
        'meta[property="og:image"]',
        "property",
        "og:image",
        articleHero
    );

}


setMetaTag(
    'meta[name="twitter:title"]',
    "name",
    "twitter:title",
    article.title || "Flying Cat Productions"
);


setMetaTag(
    'meta[name="twitter:description"]',
    "name",
    "twitter:description",
    articleDescription
);


if (articleHero) {

    setMetaTag(
        'meta[name="twitter:image"]',
        "name",
        "twitter:image",
        articleHero
    );

}


setCanonical(
    articleCanonical
);


const articleSchema = {

    "@context":
        "https://schema.org",

    "@type":
        "NewsArticle",

    "headline":
        article.title
        ||
        "",

    "description":
        articleDescription,

    "url":
        articleCanonical,

    "publisher": {
        "@type":
            "Organization",

        "name":
            "Flying Cat Productions",

        "url":
            `${SITE_URL}/`
    }

};


if (article.publicationDate) {

    articleSchema.datePublished =
        article.publicationDate;

}


if (article.updatedAt) {

    articleSchema.dateModified =
        article.updatedAt;

}


if (article.author) {

    articleSchema.author = {
        "@type":
            "Person",

        "name":
            article.author
    };

}


if (articleHero) {

    articleSchema.image =
        articleHero;

}


setStructuredData(
    articleSchema
);

                


                newsIntro.hidden =
                    true;


                newsIndex.hidden =
                    true;


                articleView.hidden =
                    false;



                const hero =
                    getMedia(
                        article.heroImage
                        ||
                        article.thumbnail
                    );



                const heroUrl =
                    getMediaUrl(

                        article.heroImage
                        ||
                        article.thumbnail,

                        "large"

                    );



                const heroAlt =
                    hero
                    ?.alternativeText

                    ||

                    article.title

                    ||

                    "";



                const articleContent =
                    Array.isArray(
                        article.content
                    )

                    ?

                    article.content

                    .map(
                        renderContentBlock
                    )

                    .join(
                        ""
                    )

                    :

                    "";



                articleView.innerHTML =
                    `


                        <!-- BACK CTA -->

                        <a
                            href="news.html"
                            class="news-article-back"
                        >

                            ← Back to News

                        </a>



                        <!-- ARTICLE TITLE -->

                        <header class="news-article-header">


                            <div>


                                <div class="news-article-meta">


                                    ${
                                        escapeHtml(
                                            article.category
                                            ||
                                            "News"
                                        )
                                    }


                                    /


                                    ${
                                        escapeHtml(
                                            formatDate(
                                                article.publicationDate
                                            )
                                        )
                                    }


                                    ${
                                        article.author

                                        ?

                                        `
                                            /
                                            ${
                                                escapeHtml(
                                                    article.author
                                                )
                                            }
                                        `

                                        :

                                        ""
                                    }


                                </div>



                                <h1 class="news-article-title">

                                    ${
                                        escapeHtml(
                                            article.title
                                            ||
                                            "Untitled"
                                        )
                                    }

                                </h1>


                            </div>



                            ${
                                article.subtitle

                                ?

                                `
                                    <p class="news-article-subtitle">

                                        ${
                                            escapeHtml(
                                                article.subtitle
                                            )
                                        }

                                    </p>
                                `

                                :

                                ""
                            }


                        </header>



                        <!-- HERO IMAGE -->

                        ${
                            heroUrl

                            ?

                            `
                                <figure class="news-article-hero">


                                    <img
                                        src="${escapeHtml(heroUrl)}"
                                        alt="${escapeHtml(heroAlt)}"
                                    >


                                    ${
                                        hero
                                        ?.caption

                                        ?

                                        `
                                            <figcaption class="article-caption">

                                                ${
                                                    escapeHtml(
                                                        hero.caption
                                                    )
                                                }

                                            </figcaption>
                                        `

                                        :

                                        ""
                                    }


                                </figure>
                            `

                            :

                            ""
                        }



                        <!-- ARTICLE BODY -->

                        <div class="news-article-body">

                            ${articleContent}

                        </div>


                    `;



                window.scrollTo(
                    {
                        top: 0,
                        behavior: "instant"
                    }
                );

            }



            /* =====================================================
               LOAD CMS
               ===================================================== */

            async function loadNews() {


                try {


                    const url =
                        `${STRAPI_URL}/api/news-articles?${buildArticleQuery()}`;


                    const response =
                        await fetch(
                            url
                        );


                    if (
                        !response.ok
                    ) {

                        throw new Error(
                            `News API returned ${response.status}`
                        );

                    }



                    const payload =
                        await response.json();



                    articles =
                        (
                            payload.data
                            ||
                            []
                        )

                        .map(
                            normaliseEntry
                        )

                        .filter(
                            Boolean
                        );



                    const pathParts =
    window.location.pathname
        .split("/")
        .filter(Boolean);


const requestedSlug =
    (
        pathParts[0] === "news"
        &&
        pathParts[1]
    )

    ?

    decodeURIComponent(
        pathParts[1]
    )

    :

    null;



                    /* ARTICLE PAGE */

                    if (
                        requestedSlug
                    ) {


                        const requestedArticle =
                            articles.find(
                                article =>
                                    article.slug
                                    ===
                                    requestedSlug
                            );


                        if (
                            requestedArticle
                        ) {

                            renderArticle(
                                requestedArticle
                            );

                            return;

                        }



                        newsIntro.hidden =
                            true;


                        newsIndex.hidden =
                            true;


                        articleView.hidden =
                            false;


                        articleView.innerHTML =
                            `

                                <a
                                    href="news.html"
                                    class="news-article-back"
                                >
                                    ← Back to News
                                </a>


                                <div class="news-empty">

                                    Article not found.

                                </div>

                            `;


                        return;

                    }



                    /* NEWS INDEX */

                    renderIndex();


                }

                catch(
                    error
                ) {


                    console.error(
                        "Could not load Flying Cat news:",
                        error
                    );


                    cmsStatus.classList.add(
                        "error"
                    );


                    cmsStatus.textContent =
                        "Could not load Flying Cat news. Please try again shortly.";


                }


            }



            loadNews();


        })();

    </script>
